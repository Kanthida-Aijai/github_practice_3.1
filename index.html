<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ประวัตการทำงาน</title>
</head>
<body>
  
<div class="form-card">
  <form>
    
    <div class="section-header">
      <div class="icon-box icon-green">🎓</div>
      <h2 class="section-title">ประวัติการศึกษา</h2>
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label>ระดับการศึกษา <span class="required">*</span></label>
        <input type="text" placeholder="เช่น ปริญญาตรี" required>
      </div>
      <div class="form-group">
        <label>สถาบันการศึกษา <span class="required">*</span></label>
        <input type="text" placeholder="ชื่อสถาบันการศึกษา" required>
      </div>
    </div>
    <div class="grid-2">
      <div class="form-group">
        <label>ปีที่จบการศึกษา</label>
        <input type="text" placeholder="พ.ศ. 2566">
      </div>
    </div>
    <hr class="divider">
    <div class="section-header">
      <div class="icon-box icon-blue">💼</div>
      <h2 class="section-title">ประวัติการทำงาน</h2>
    </div>
    <div class="grid-2">
      <div class="form-group">
        <label>บริษัทที่ทำงานล่าสุด</label>
        <input type="text" placeholder="ชื่อบริษัท">
      </div>
      <div class="form-group">
        <label>ตำแหน่งงาน</label>
        <input type="text" placeholder="ตำแหน่งที่เคยทำ">
      </div>
    </div>
    <div class="form-group">
      <label>ประสบการณ์การทำงาน</label>
      <textarea placeholder="อธิบายเกี่ยวกับประสบการณ์การทำงานของคุณ"></textarea>
    </div>
    <hr class="divider">
    <div class="form-group">
      <label class="label-bold">ประเภทการจ้างงานที่ต้องการ <span class="required">*</span></label>
      <div class="options-group">
        <label class="option-item">
          <input type="radio" name="job_type" value="fulltime" checked> พนักงานประจำ
        </label>
        <label class="option-item">
          <input type="radio" name="job_type" value="parttime"> พนักงานชั่วคราว
        </label>
        <label class="option-item">
          <input type="radio" name="job_type" value="freelance"> ฟรีแลนซ์
        </label>
        <label class="option-item">
          <input type="radio" name="job_type" value="internship"> นักศึกษาฝึกงาน
        </label>
      </div>
    </div>
    <hr class="divider">
    <div class="form-group">
      <label class="label-bold">ทักษะที่มี (เลือกได้หลายข้อ)</label>
      <div class="options-group">
        <label class="option-item">
          <input type="checkbox" name="skills" value="office"> Microsoft Office
        </label>
        <label class="option-item">
          <input type="checkbox" name="skills" value="english"> การสื่อสารภาษาอังกฤษ
        </label>
        <label class="option-item">
          <input type="checkbox" name="skills" value="teamwork"> การทำงานเป็นทีม
        </label>
        <label class="option-item">
          <input type="checkbox" name="skills" value="problem_solving"> การแก้ปัญหา
        </label>
      </div>
    </div>
    <hr class="divider">
    <div class="btn-submit-container">
      <button type="submit" class="btn-submit">
        <span>✈️</span> ส่งใบสมัคร
      </button>
    </div>
  </form>
</div>
</body>
</html>
