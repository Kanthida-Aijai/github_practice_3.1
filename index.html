<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ข้อมูลส่วนตัว</title>
</head>
<body>
  <div class="form-card">
    <form>
    
      <div class="section-title">
        <div class="icon-box user-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
        <h2>ข้อมูลส่วนตัว</h2>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label>ชื่อ <span class="required">*</span></label>
          <input type="text" placeholder="กรอกชื่อของคุณ" required>
        </div>

        <div class="form-group">
          <label>นามสกุล <span class="required">*</span></label>
          <input type="text" placeholder="กรอกนามสกุลของคุณ" required>
        </div>

        <div class="form-group">
          <label>อีเมล <span class="required">*</span></label>
          <input type="email" placeholder="email@example.com" required>
        </div>

        <div class="form-group">
          <label>เบอร์โทรศัพท์ <span class="required">*</span></label>
          <input type="tel" placeholder="0XX-XXX-XXXX" required>
        </div>

        <div class="form-group full-width">
          <label>ที่อยู่</label>
          <textarea rows="3" placeholder="กรอกที่อยู่ปัจจุบัน"></textarea>
        </div>

        <div class="form-group full-width">
          <label>จังหวัด</label>
          <div class="select-wrapper">
            <select>
              <option value="" disabled selected hidden>เลือกจังหวัด</option>
              <option value="bangkok">กรุงเทพมหานคร</option>
              <option value="chiangmai">เชียงใหม่</option>
             
            </select>
          </div>
        </div>
      </div>

      <div class="section-title margin-top">
        <div class="icon-box edu-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
            <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
          </svg>
        </div>
        <h2>ประวัติการศึกษา</h2>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label>ระดับการศึกษา <span class="required">*</span></label>
          <input type="text" placeholder="เช่น ปริญญาตรี" required>
        </div>

        <div class="form-group">
          <label>สถาบันการศึกษา <span class="required">*</span></label>
          <input type="text" placeholder="ชื่อสถาบันการศึกษา" required>
        </div>

        <div class="form-group">
          <label>ปีที่จบการศึกษา</label>
          <input type="text" placeholder="พ.ศ. 2566">
        </div>
      </div>
    </form>
  </div>
</body>
</html>
